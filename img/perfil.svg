<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd5b5" />
      <stop offset="100%" stop-color="#e2a77f" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Neon Tech Ring -->
  <rect width="400" height="400" fill="url(#avatarBg)" rx="200"/>
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Body / Shoulders -->
  <g filter="url(#glow)">
    <path d="M100 370 C100 290 140 270 200 270 C260 270 300 290 300 370 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <path d="M140 370 L170 305 L200 330 L230 305 L260 370 Z" fill="#0f172a"/>
    <!-- Neck -->
    <rect x="175" y="220" width="50" height="60" rx="8" fill="url(#skinGrad)"/>
    <path d="M175 255 L200 275 L225 255 Z" fill="#d4936d"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="58" ry="72" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <ellipse cx="140" cy="180" rx="10" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="260" cy="180" rx="10" ry="16" fill="url(#skinGrad)"/>

    <!-- Hair (Modern styled haircut) -->
    <path d="M140 165 C138 120 165 95 200 95 C235 95 262 120 260 165 C255 130 230 115 200 115 C170 115 145 130 140 165 Z" fill="url(#hairGrad)"/>
    <path d="M142 160 C145 135 170 118 215 110 C245 105 258 118 260 145 C250 135 235 130 215 130 C185 130 155 142 142 160 Z" fill="#3b4657"/>

    <!-- Beard / Goatee (Professional trimmed developer look) -->
    <path d="M165 195 C175 240 225 240 235 195 C225 215 175 215 165 195 Z" fill="#2d3748" opacity="0.85"/>
    <path d="M185 228 C195 235 205 235 215 228 C210 233 190 233 185 228 Z" fill="#1a202c"/>

    <!-- Eyes & Eyebrows -->
    <path d="M168 152 Q180 146 190 152" stroke="#1a202c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M210 152 Q220 146 232 152" stroke="#1a202c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="179" cy="162" r="5" fill="#1a202c"/>
    <circle cx="221" cy="162" r="5" fill="#1a202c"/>
    <circle cx="180.5" cy="160.5" r="1.5" fill="#ffffff"/>
    <circle cx="222.5" cy="160.5" r="1.5" fill="#ffffff"/>

    <!-- Glasses (Modern tech developer style) -->
    <rect x="156" y="148" width="38" height="26" rx="7" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="206" y="148" width="38" height="26" rx="7" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="194" y1="160" x2="206" y2="160" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="145" y1="158" x2="156" y2="158" stroke="#38bdf8" stroke-width="2"/>
    <line x1="244" y1="158" x2="255" y2="158" stroke="#38bdf8" stroke-width="2"/>

    <!-- Nose & Smile -->
    <path d="M200 167 L197 182 L204 182" stroke="#d4936d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M188 198 Q200 208 212 198" stroke="#b46a48" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Tech Symbol Indicator Badge -->
  <g transform="translate(290, 275)" filter="url(#glow)">
    <circle cx="30" cy="30" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
