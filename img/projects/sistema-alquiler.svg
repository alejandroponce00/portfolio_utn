<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="680" cy="90" r="160" fill="url(#glow2)"/>
  <circle cx="120" cy="360" r="140" fill="url(#glow2)"/>

  <!-- Console / Terminal UI Mockup -->
  <g transform="translate(150, 60)" filter="url(#shadow2)">
    <rect width="500" height="320" rx="16" fill="#0d1117" stroke="rgba(56,189,248,0.25)" stroke-width="1.5"/>
    
    <!-- Window header -->
    <rect width="500" height="44" rx="16" fill="#161b22"/>
    <rect y="30" width="500" height="14" fill="#161b22"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    <text x="250" y="27" fill="#8b949e" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" text-anchor="middle">rental_system.cpp — C++ / POO Engine</text>

    <!-- Code & Status UI -->
    <g transform="translate(35, 70)">
      <text x="0" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">// Sistema de Gestión de Flota Urbana</text>
      <text x="0" y="44" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="12">class <tspan fill="#f69d50">SistemaAlquiler</tspan> : public <tspan fill="#d2a8ff">GestorFlota</tspan> {</text>
      <text x="20" y="68" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="12">void registrarAlquiler(Vehiculo v, Cliente c);</text>
      <text x="20" y="92" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="12">bool persistirEnBinario(const std::string&amp; path);</text>
      <text x="0" y="116" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="12">};</text>

      <!-- Terminal output cards -->
      <g transform="translate(0, 140)">
        <rect width="430" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
        <text x="18" y="28" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="12">🚴 Bicicletas disponibles: 48 | 🛴 Monopatines: 32</text>
        <text x="18" y="52" fill="#3fb950" font-family="'JetBrains Mono', monospace" font-size="12">✓ Datos serializados correctamente en archivo binario</text>
      </g>
    </g>
  </g>
</svg>
