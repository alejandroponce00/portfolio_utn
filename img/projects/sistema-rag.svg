<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#191338" />
      <stop offset="100%" stop-color="#0a0a14" />
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  <circle cx="690" cy="80" r="170" fill="url(#glow4)"/>
  <circle cx="110" cy="360" r="140" fill="url(#glow4)"/>

  <!-- AI RAG pipeline UI Mockup -->
  <g transform="translate(150, 60)" filter="url(#shadow4)">
    <rect width="500" height="320" rx="16" fill="#120e24" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
    
    <!-- Window header -->
    <rect width="500" height="44" rx="16" fill="#1f183d"/>
    <rect y="30" width="500" height="14" fill="#1f183d"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    <text x="250" y="27" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle">RAG Document Q&amp;A Engine — Ollama + Mistral</text>

    <!-- Visual Architecture of RAG -->
    <g transform="translate(30, 70)">
      <!-- Step 1: Doc -->
      <g transform="translate(10, 15)">
        <rect width="110" height="60" rx="8" fill="#1f183d" stroke="#6b21a8" stroke-width="1"/>
        <text x="55" y="28" fill="#e9d5ff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">📄 Documentos</text>
        <text x="55" y="46" fill="#a855f7" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">PDFs / Textos</text>
      </g>
      <text x="135" y="50" fill="#a855f7" font-size="16">→</text>

      <!-- Step 2: Vector Embeddings -->
      <g transform="translate(160, 15)">
        <rect width="120" height="60" rx="8" fill="#1f183d" stroke="#6b21a8" stroke-width="1"/>
        <text x="60" y="28" fill="#e9d5ff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">🧠 Embeddings</text>
        <text x="60" y="46" fill="#38bdf8" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">Vector Store</text>
      </g>
      <text x="295" y="50" fill="#a855f7" font-size="16">→</text>

      <!-- Step 3: LLM -->
      <g transform="translate(320, 15)">
        <rect width="110" height="60" rx="8" fill="#1f183d" stroke="#c084fc" stroke-width="1"/>
        <text x="55" y="28" fill="#e9d5ff" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">🤖 Ollama</text>
        <text x="55" y="46" fill="#f43f5e" font-family="'JetBrains Mono'" font-size="10" text-anchor="middle">Mistral 7B</text>
      </g>

      <!-- Terminal / Chat prompt output -->
      <g transform="translate(10, 100)">
        <rect width="420" height="100" rx="8" fill="#181230" stroke="#3b2d66" stroke-width="1"/>
        <text x="18" y="28" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12">&gt; Consulta: "¿Cuáles son las cláusulas de SLA del contrato?"</text>
        <text x="18" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">[Contexto recuperado: 3 fragmentos de alta relevancia (cosine: 0.89)]</text>
        <text x="18" y="80" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Respuesta generada con precisión sin alucinaciones.</text>
      </g>
    </g>
  </g>
</svg>
