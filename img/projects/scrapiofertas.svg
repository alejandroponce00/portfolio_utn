<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141e33" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  <circle cx="680" cy="100" r="160" fill="url(#glow3)"/>
  <circle cx="120" cy="340" r="140" fill="url(#glow3)"/>

  <!-- Scraping Pipeline UI Mockup -->
  <g transform="translate(150, 60)" filter="url(#shadow3)">
    <rect width="500" height="320" rx="16" fill="#0f172a" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
    
    <!-- Window header -->
    <rect width="500" height="44" rx="16" fill="#1e293b"/>
    <rect y="30" width="500" height="14" fill="#1e293b"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    <text x="250" y="27" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scrapiofertas — Automated Price Tracker</text>

    <!-- Content -->
    <g transform="translate(35, 65)">
      <!-- Scraper status -->
      <g transform="translate(0, 10)">
        <rect width="430" height="42" rx="8" fill="#1e293b"/>
        <circle cx="25" cy="21" r="5" fill="#10b981"/>
        <text x="42" y="26" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">Bot: Puppeteer Headless Worker [Running]</text>
        <rect x="330" y="10" width="85" height="22" rx="4" fill="#047857"/>
        <text x="345" y="25" fill="#a7f3d0" font-family="system-ui" font-size="10" font-weight="700">CRON 00:00</text>
      </g>

      <!-- Items comparison card -->
      <g transform="translate(0, 65)">
        <rect width="430" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="20" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🛒 Supermercado A vs Supermercado B</text>
        <text x="20" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Descuento detectado: -35% en lácteos y despensa</text>
        <text x="360" y="38" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Ahorro</text>
      </g>

      <!-- Tech tags bottom -->
      <g transform="translate(0, 140)">
        <rect width="430" height="65" rx="8" fill="#111827"/>
        <text x="18" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Sync Status: Sincronizado con Firebase Firestore</text>
        <text x="18" y="50" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">Pipeline: GitHub Actions CI/CD ejecutado con éxito</text>
      </g>
    </g>
  </g>
</svg>
