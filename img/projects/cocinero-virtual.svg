<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg1)"/>
  <circle cx="700" cy="80" r="180" fill="url(#glow1)"/>
  <circle cx="100" cy="350" r="140" fill="url(#glow1)"/>

  <!-- Code / UI Card Mockup -->
  <g transform="translate(150, 60)" filter="url(#shadow)">
    <rect width="500" height="320" rx="16" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Window header -->
    <rect width="500" height="44" rx="16" fill="#27272a"/>
    <rect y="30" width="500" height="14" fill="#27272a"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    <text x="250" y="27" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tu Cocinero Virtual — AI Recipe Generator</text>

    <!-- Chef / AI Badge -->
    <g transform="translate(40, 75)">
      <circle cx="35" cy="35" r="35" fill="url(#accent1)" opacity="0.2"/>
      <path d="M35 15 C25 15 20 22 20 28 C16 30 15 35 18 39 C15 44 20 50 25 50 L45 50 C50 50 55 44 52 39 C55 35 54 30 50 28 C50 22 45 15 35 15 Z" fill="url(#accent1)"/>
      <rect x="22" y="44" width="26" height="5" rx="2" fill="#ffffff" opacity="0.8"/>
      <text x="85" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Asistente Culinario con IA</text>
      <text x="85" y="48" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13">Next.js • React • Vercel AI SDK • Tailwind CSS</text>
    </g>

    <!-- Prompt UI -->
    <rect x="40" y="160" width="420" height="50" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="56" y="190" fill="#71717a" font-family="monospace" font-size="13">✨ "¿Qué puedo cocinar con espinaca, pollo y queso crema?"</text>

    <!-- Response tags -->
    <rect x="40" y="230" width="130" height="42" rx="8" fill="#10b981" opacity="0.15"/>
    <text x="55" y="256" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ Receta generada</text>

    <rect x="185" y="230" width="130" height="42" rx="8" fill="#6366f1" opacity="0.15"/>
    <text x="200" y="256" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⏱️ Tiempo: 25 min</text>

    <rect x="330" y="230" width="130" height="42" rx="8" fill="#f59e0b" opacity="0.15"/>
    <text x="345" y="256" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🍲 Dificultad: Fácil</text>
  </g>
</svg>
